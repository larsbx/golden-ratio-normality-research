name = "goldenRidoutReplay"
version = "0.1.0"
defaultTargets = ["RidoutReplay"]

[leanOptions]
autoImplicit = false
warningAsError = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "5e0c4e5239cb0a2d86d68a884bf52cfd963fce22"

[[require]]
name = "FiniteMathKernels"
git = "https://github.com/larsbx/finite-math-kernels"
rev = "8750345c496390a7ce4f6a80be331451aa999408"
subDir = "tests/lean"

[[require]]
name = "SubspaceTheorems"
git = "https://github.com/rwst/Subspace-Theorems"
rev = "2fc7bea12d398fbc8ea758ecb8516efe8e3ef33d"

[[lean_lib]]
name = "GoldenNormality"
srcDir = "../.."

[[lean_lib]]
name = "RidoutReplay"
