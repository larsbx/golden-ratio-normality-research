name: Ridout proof replay

on:
  push:
    branches: [main, research/ridout-dyadic-bridge]
    paths:
      - 'claims.json'
      - 'verification/ridout/**'
      - 'GoldenNormality/**'
      - '.github/workflows/ridout-replay.yml'
  pull_request:
    paths:
      - 'claims.json'
      - 'verification/ridout/**'
      - 'GoldenNormality/**'
      - '.github/workflows/ridout-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ridout-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ridout:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: verification/ridout
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore pinned dependency builds
        id: cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: verification/ridout/.lake
          key: ridout-${{ runner.os }}-${{ hashFiles('verification/ridout/lean-toolchain', 'verification/ridout/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: ridout-${{ runner.os }}-${{ hashFiles('verification/ridout/lean-toolchain', 'verification/ridout/lake-manifest.json') }}-
      - name: Install checksum-verified Lean
        shell: bash
        run: |
          set -euo pipefail
          ridout_toolchain_dir="$RUNNER_TEMP/gnr-ridout-toolchain"
          mkdir -p "$ridout_toolchain_dir"
          curl --fail --silent --show-error --location \
            https://github.com/leanprover/lean4/releases/download/v4.35.0-rc3/lean-4.35.0-rc3-linux.tar.zst \
            -o "$ridout_toolchain_dir/lean.tar.zst"
          printf '%s  %s\n' \
            1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997 \
            "$ridout_toolchain_dir/lean.tar.zst" | sha256sum --check
          tar --zstd -xf "$ridout_toolchain_dir/lean.tar.zst" -C "$ridout_toolchain_dir"
          printf '%s\n' \
            "$ridout_toolchain_dir/lean-4.35.0-rc3-linux/bin" >> "$GITHUB_PATH"
      - name: Compile source closure and inspect axioms
        run: python3 replay.py
      - name: Retain dependency builds
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: verification/ridout/.lake
          key: ridout-${{ runner.os }}-${{ hashFiles('verification/ridout/lean-toolchain', 'verification/ridout/lake-manifest.json') }}-${{ github.sha }}
      - name: Retain exact-source proof evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ridout-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: verification/ridout/build/
          if-no-files-found: error
