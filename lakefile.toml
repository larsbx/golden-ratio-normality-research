[[require]]
name = "FiniteMathKernels"
git = "https://github.com/larsbx/finite-math-kernels"
rev = "8750345c496390a7ce4f6a80be331451aa999408"
subDir = "tests/lean"

[[lean_lib]]
name = "GoldenNormality"
